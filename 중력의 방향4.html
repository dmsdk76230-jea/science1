<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>지구 중력 방향 - 학생용 그림판</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Malgun Gothic', sans-serif; overflow-x: hidden; }
        .no-scroll { touch-action: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-4">

    <!-- 상단 타이틀 -->
    <header class="text-center my-1">
        <h1 class="text-xl md:text-3xl font-bold text-sky-400">🌍 지구를 향한 중력의 방향</h1>
        <p class="text-xs md:text-sm text-slate-300 mt-1">내 번호 칸을 터치하여 지구가 우리를 당기는 모습을 그려보세요!</p>
    </header>

    <!-- 메인 컨테이너 (확대된 중앙 지구 + 주변 28개 회전된 번호 칸) -->
    <main class="relative w-full max-w-5xl aspect-square flex items-center justify-center my-auto scale-90 md:scale-100">
        
        <!-- 중앙 지구 -->
        <div class="absolute w-52 h-52 md:w-76 md:h-76 rounded-full bg-gradient-to-tr from-blue-600 to-teal-400 flex flex-col items-center justify-center shadow-[0_0_60px_rgba(56,189,248,0.5)] border-4 border-sky-300 z-10 text-center p-2">
            <span class="text-5xl md:text-7xl">🌍</span>
            <span class="font-bold text-sm md:text-lg text-white mt-2 drop-shadow">지구 중심</span>
            <span class="text-[11px] md:text-xs text-sky-100">중력은 언제나 지구 중심!</span>
        </div>

        <!-- 28개 번호 칸 배치를 위한 원형 영역 -->
        <div id="grid-container" class="absolute inset-0 w-full h-full"></div>
    </main>

    <!-- 하단 안내 바 -->
    <footer class="w-full max-w-xl flex justify-center items-center bg-slate-800/90 p-3 rounded-xl border border-slate-700 shadow-lg">
        <div class="text-xs text-slate-300 text-center">
            💡 <span class="text-sky-400 font-bold">크롬북 터치 가능:</span> 본인 출석 번호 칸을 터치해 그림을 그리세요!
        </div>
    </footer>

    <!-- 그림판 모달 팝업 -->
    <div id="paint-modal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-sm md:max-w-md rounded-2xl p-4 md:p-5 shadow-2xl flex flex-col items-center">
            
            <!-- 모달 헤더 -->
            <div class="flex justify-between w-full items-center mb-2">
                <h3 id="modal-title" class="text-base md:text-lg font-bold text-sky-300">번 학생 그림판</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-2xl font-bold px-2 cursor-pointer">&times;</button>
            </div>
            
            <p class="text-[11px] text-slate-400 mb-2 self-start">아래 초록색 땅 위에 서 있는 사람이나 물건, 그리고 중력 방향을 그려보세요!</p>

            <!-- 그리기 캔버스 (배경 가이드라인 포함) -->
            <div class="border-2 border-slate-700 rounded-xl overflow-hidden bg-white shadow-inner mb-3 no-scroll cursor-crosshair">
                <canvas id="drawing-canvas" width="300" height="300" class="block touch-none"></canvas>
            </div>

            <!-- 툴바 (색상, 지우개, 초기화) -->
            <div class="flex items-center justify-between w-full mb-4 gap-2 bg-slate-800/60 p-2 rounded-xl border border-slate-700">
                <div class="flex gap-2">
                    <button onclick="setPenColor('#000000')" class="w-7 h-7 rounded-full bg-black border-2 border-white shadow color-btn" title="검은색"></button>
                    <button onclick="setPenColor('#ef4444')" class="w-7 h-7 rounded-full bg-red-500 border-2 border-transparent shadow color-btn" title="빨간색"></button>
                    <button onclick="setPenColor('#3b82f6')" class="w-7 h-7 rounded-full bg-blue-500 border-2 border-transparent shadow color-btn" title="파란색"></button>
                    <button onclick="setPenColor('#22c55e')" class="w-7 h-7 rounded-full bg-green-600 border-2 border-transparent shadow color-btn" title="초록색"></button>
                </div>
                <div class="flex gap-1.5">
                    <button onclick="setEraser()" id="eraser-btn" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-2.5 py-1.5 rounded-lg transition cursor-pointer">지우개</button>
                    <button onclick="clearCanvasKeepGuide()" class="bg-slate-700 hover:bg-slate-600 text-xs text-slate-200 px-2.5 py-1.5 rounded-lg transition cursor-pointer">모두 지우기</button>
                </div>
            </div>

            <!-- 저장 버튼 -->
            <button onclick="saveDrawing()" class="w-full bg-sky-500 hover:bg-sky-600 text-slate-950 font-bold py-2.5 rounded-xl transition shadow-lg cursor-pointer text-sm">
                그림 저장 및 실시간 공유하기 ✨
            </button>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        // 파이어베이스 설정 및 데이터베이스 URL 반영 완료[cite: 2]
        const firebaseConfig = {
            apiKey: "AIzaSyAXqo6NBjWcjx0VnY_Q1lnQdKmEKOjDq04",
            authDomain: "gravity-class.firebaseapp.com",
            databaseURL: "https://gravity-class-default-rtdb.firebaseio.com",
            projectId: "gravity-class",
            storageBucket: "gravity-class.firebasestorage.app",
            messagingSenderId: "146704667951",
            appId: "1:146704667951:web:588b095db5e083c365bdda",
            measurementId: "G-LG21T91W8B"
        };

        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch (e) {
            console.log("Firebase 초기화 오류:", e);
        }

        const totalStudents = 28;
        let currentNumber = null;
        
        const canvas = document.getElementById('drawing-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let currentColor = '#000000';
        let currentLineWidth = 4;
        let drawingsData = {};

        function initGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            
            const radius = window.innerWidth < 768 ? 165 : 260;
            const centerX = container.clientWidth / 2 || 250;
            const centerY = container.clientHeight / 2 || 250;

            for (let i = 1; i <= totalStudents; i++) {
                const angle = ((i - 1) / totalStudents) * 2 * Math.PI - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle) - 36;
                const y = centerY + radius * Math.sin(angle) - 36;
                const degrees = (angle * (180 / Math.PI)) + 90;

                const btn = document.createElement('button');
                btn.className = `absolute w-18 h-18 md:w-22 md:h-22 rounded-2xl bg-slate-800/95 border-2 border-slate-700 hover:border-sky-400 flex flex-col items-center justify-center shadow-lg transition-all transform hover:scale-105 cursor-pointer overflow-hidden p-1`;
                btn.style.left = `${x}px`;
                btn.style.top = `${y}px`;
                btn.style.transform = `rotate(${degrees}deg)`;
                
                btn.innerHTML = `
                    <span class="text-[9px] md:text-[10px] font-bold text-sky-400 absolute top-0.5 left-1 bg-slate-900/90 px-1 rounded" style="transform: rotate(${-degrees}deg)">${i}번</span>
                    <canvas id="thumb-${i}" width="50" height="50" class="w-10 h-10 md:w-13 md:h-13 bg-white rounded mt-2 pointer-events-none"></canvas>
                `;
                
                btn.onclick = () => openModal(i);
                container.appendChild(btn);
            }
        }

        window.onload = () => {
            initGrid();
            if (db) {
                db.ref('drawings').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        drawingsData = data;
                        updateAllThumbnails();
                    } else {
                        drawingsData = {};
                        clearAllThumbnailsUI();
                    }
                });
            }
        };

        window.onresize = initGrid;

        function drawGuideBackground() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#16a34a'; // 초록색 땅
            ctx.fillRect(0, 250, 300, 50);
            
            ctx.fillStyle = '#15803d';
            ctx.fillRect(0, 245, 300, 5);

            ctx.fillStyle = '#64748b';
            ctx.font = '11px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('▼ 지구 중심 방향 (아래쪽 땅)', 150, 275);
        }

        function openModal(number) {
            currentNumber = number;
            document.getElementById('modal-title').innerText = `${number}번 학생 그림판`;
            document.getElementById('paint-modal').classList.remove('hidden');
            document.getElementById('paint-modal').classList.add('flex');
            
            drawGuideBackground();
            
            if (drawingsData[number]) {
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
                img.src = drawingsData[number];
            }
        }

        function closeModal() {
            document.getElementById('paint-modal').classList.remove('flex');
            document.getElementById('paint-modal').classList.add('hidden');
            currentNumber = null;
        }

        function getCanvasPos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDraw);
        canvas.addEventListener('mouseleave', stopDraw);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
        canvas.addEventListener('touchend', (e) => { e.preventDefault(); stopDraw(); }, { passive: false });

        function startDraw(e) {
            isDrawing = true;
            const pos = getCanvasPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        function draw(e) {
            if (!isDrawing) return;
            const pos = getCanvasPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.strokeStyle = currentColor;
            ctx.lineWidth = currentLineWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
        }

        function stopDraw() {
            isDrawing = false;
        }

        function setPenColor(color) {
            currentColor = color;
            currentLineWidth = 4;
        }

        function setEraser() {
            currentColor = '#ffffff';
            currentLineWidth = 20;
        }

        function clearCanvasKeepGuide() {
            drawGuideBackground();
        }

        function saveDrawing() {
            if (!currentNumber) return;
            const dataURL = canvas.toDataURL('image/png');
            
            drawingsData[currentNumber] = dataURL;
            updateThumbnail(currentNumber, dataURL);

            if (db) {
                db.ref('drawings/' + currentNumber).set(dataURL);
            } else {
                alert('Firebase 설정이 없어 이 기기에서만 임시 저장됩니다.');
            }
            closeModal();
        }

        function updateThumbnail(number, dataURL) {
            const thumbCanvas = document.getElementById(`thumb-${number}`);
            if (!thumbCanvas) return;
            const tCtx = thumbCanvas.getContext('2d');
            const img = new Image();
            img.onload = () => {
                tCtx.clearRect(0, 0, thumbCanvas.width, thumbCanvas.height);
                tCtx.drawImage(img, 0, 0, thumbCanvas.width, thumbCanvas.height);
            };
            img.src = dataURL;
        }

        function updateAllThumbnails() {
            for (let i = 1; i <= totalStudents; i++) {
                if (drawingsData[i]) {
                    updateThumbnail(i, drawingsData[i]);
                }
            }
        }
    </script>
</body>
</html>
